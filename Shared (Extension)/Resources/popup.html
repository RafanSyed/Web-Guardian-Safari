<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pure Path</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <div class="header-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3z"></path>
      </svg>
    </div>
    <div class="header-title">Pure Path</div>
  </div>

  <div class="card">
    <div class="domain-label">Current site</div>
    <div id="current-domain">—</div>

    <div id="current-status">
      <span class="status-badge status-unknown">Checking…</span>
    </div>

    <button id="btn-block-site" class="btn-danger">Block this site</button>

    <div id="confirm-box" style="display:none; margin-top:10px; padding:12px; background:rgba(180,67,46,0.08); border:1px solid rgba(180,67,46,0.2); border-radius:10px; text-align:center;">
      <p style="font-size:12.5px; margin:0 0 10px;">Block this site?</p>
      <div style="display:flex; gap:8px;">
        <button id="confirm-yes" class="btn-danger" style="flex:1;">Yes, block</button>
        <button id="confirm-no" class="btn-disabled" style="flex:1; pointer-events:auto; cursor:pointer;">Cancel</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="blocked-count">—</div>
        <div class="stat-label">Blocked</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="total-count">—</div>
        <div class="stat-label">Tracked</div>
      </div>
    </div>

    <div id="toast"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
